name: Haus

options:
  bundleIdPrefix: chat.haus
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

packages:
  HausIOS:
    path: .
  ClerkKit:
    url: https://github.com/clerk/clerk-ios
    exactVersion: 1.2.0

targets:
  Haus:
    type: application
    platform: iOS
    sources:
      - path: Sources/HausApp
      - path: ../../assets/mac-icon.icon
        buildPhase: resources
        # The shared icon lives above this directory. Intermediate groups would
        # climb past the project root and synthesize a navigator group named
        # after the checkout directory, so XcodeGen's name-derived reference IDs
        # would change per worktree and churn the checked-in project.
        createIntermediateGroups: false
    dependencies:
      - package: HausIOS
        product: HausModels
      - package: HausIOS
        product: HausTransport
      - package: HausIOS
        product: HausUI
      - package: ClerkKit
        product: ClerkKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.haus.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: mac-icon
        # Local/dev default only. A real TestFlight upload always overrides both
        # via explicit xcodebuild args from `bun run ios:release`; see
        # docs/operations/ios-testflight.md. Both values mirror the latest
        # published iOS target in releases.json via release:sync-versions.
        CURRENT_PROJECT_VERSION: "30"
        MARKETING_VERSION: 3.1.0
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Haus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - mac-icon60x60
            CFBundleIconName: mac-icon
        "CFBundleIcons~ipad":
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - mac-icon60x60
              - mac-icon76x76
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - haus
              - chat.haus.ios
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Take photos to attach to Haus messages.
        NSPhotoLibraryUsageDescription: Choose photos to attach to Haus messages.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Config/Haus.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:clerk.haus.chat
    postBuildScripts:
      - name: Install precompiled iOS icon
        path: scripts/install-precompiled-icon.sh
        basedOnDependencyAnalysis: false

schemes:
  Haus:
    build:
      targets:
        Haus: all
    run:
      config: Debug
    test:
      config: Debug
