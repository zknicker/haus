name: Haus

options:
  bundleIdPrefix: chat.haus
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

settings:
  base:
    # Project level so the app and its Notification Service extension always
    # share one version; App Store Connect rejects an extension that differs.
    # Local/dev default only. A real TestFlight upload always overrides both
    # via explicit xcodebuild args from `bun run ios:release`; see
    # docs/operations/ios-testflight.md. Both values mirror the latest
    # published iOS target in releases.json via release:sync-versions.
    CURRENT_PROJECT_VERSION: "46"
    MARKETING_VERSION: 5.6.0

packages:
  HausIOS:
    path: .
  ClerkKit:
    url: https://github.com/clerk/clerk-ios
    exactVersion: 1.2.0

targets:
  Haus:
    type: application
    platform: iOS
    sources:
      - path: Sources/HausApp
      - path: ../../assets/mac-icon.icon
        buildPhase: resources
        # The shared icon lives above this directory. Intermediate groups would
        # climb past the project root and synthesize a navigator group named
        # after the checkout directory, so XcodeGen's name-derived reference IDs
        # would change per worktree and churn the checked-in project.
        createIntermediateGroups: false
    dependencies:
      - package: HausIOS
        product: HausModels
      - package: HausIOS
        product: HausTransport
      - package: HausIOS
        product: HausUI
      - package: ClerkKit
        product: ClerkKit
      - target: HausNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.haus.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: mac-icon
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Haus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - mac-icon60x60
            CFBundleIconName: mac-icon
        "CFBundleIcons~ipad":
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - mac-icon60x60
              - mac-icon76x76
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - haus
              - chat.haus.ios
        # The ghost sits where HausOpeningView draws it, on the same system
        # background, so launch hands off to the opening frame without a pop.
        UILaunchScreen:
          UIImageName: LaunchGhost
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Take photos to attach to Haus messages.
        NSMicrophoneUsageDescription: Talk with your Haus Agents during voice calls.
        NSPhotoLibraryUsageDescription: Choose photos to attach to Haus messages.
        UIRequiresFullScreen: true
        # Lets the Notification Service extension present pushes as
        # communication notifications with the sender's avatar.
        NSUserActivityTypes:
          - INSendMessageIntent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Config/Haus.entitlements
      properties:
        # Development here; exporting with the App Store profile re-signs it as
        # production. See docs/operations/ios-testflight.md.
        aps-environment: development
        com.apple.developer.associated-domains:
          - webcredentials:clerk.haus.chat
        com.apple.developer.usernotifications.communication: true
    postBuildScripts:
      - name: Install precompiled iOS icon
        path: scripts/install-precompiled-icon.sh
        basedOnDependencyAnalysis: false

  HausNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/HausNotificationService
    dependencies:
      - package: HausIOS
        product: HausModels
      - sdk: Intents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.haus.ios.NotificationService
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
    info:
      path: Config/NotificationService-Info.plist
      properties:
        CFBundleDisplayName: Haus Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  HausRenderingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SimulatorTests
      - path: Sources/HausApp/Voice/VoiceAudioStartup.swift
    dependencies:
      - package: HausIOS
        product: HausUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "6.0"

schemes:
  Haus:
    build:
      targets:
        Haus: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HausRenderingTests
