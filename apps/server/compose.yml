name: haus

services:
  postgres:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: haus-postgres
    environment:
      POSTGRES_DB: haus_production
      POSTGRES_PASSWORD: ${HAUS_POSTGRES_ADMIN_PASSWORD:?HAUS_POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_USER: haus_admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:5438:5432"
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 60s
    # CVE-2026-98432: MPTCP is per network namespace; host-off is not enough.
    sysctls:
      net.mptcp.enabled: "0"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  haus-runner:
    build:
      context: ../..
      dockerfile: apps/runner/Dockerfile
    container_name: haus-runner
    cap_add:
      - NET_ADMIN
    environment:
      HAUS_RUNNER_CLAUDE_SETUP_TOKEN: ${HAUS_RUNNER_CLAUDE_SETUP_TOKEN:-}
      HAUS_RUNNER_GEMINI_API_KEY: ${HAUS_RUNNER_GEMINI_API_KEY:-}
      HAUS_RUNNER_MAX_WARM: ${HAUS_RUNNER_MAX_WARM:-}
      HAUS_RUNNER_OPENROUTER_API_KEY: ${HAUS_RUNNER_OPENROUTER_API_KEY:-}
      HAUS_RUNNER_TOKEN: ${HAUS_RUNNER_TOKEN:?HAUS_RUNNER_TOKEN is required}
      HAUS_RUNNER_WEB_SEARCH: ${HAUS_RUNNER_WEB_SEARCH:-}
      HAUS_RUNNER_XAI_API_KEY: ${HAUS_RUNNER_XAI_API_KEY:-}
      HAUS_SERVER_URL: ${HAUS_RUNNER_SERVER_URL:-http://host.docker.internal:18791}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - runner
    restart: unless-stopped
    volumes:
      - runner_data:/data

volumes:
  postgres_data:
    name: haus_postgres_data
  runner_data:
    name: haus_runner_data
