name: Set up Haus release dependencies
description: Install the frozen worktree dependencies with the scoped CI bootstrap identity

inputs:
  ci-op-token:
    description: Existing CI bootstrap identity for licensed dependency setup
    required: true
  install-xcodegen:
    description: Install XcodeGen for the iOS release lane
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.5'
    - name: Set up Node for harness bridges
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Enable the pinned harness package manager
      shell: bash
      run: corepack enable pnpm
    - name: Set up XcodeGen
      if: inputs.install-xcodegen == 'true'
      shell: bash
      run: brew install xcodegen
    - name: Install dependencies with CI bootstrap identity
      shell: bash
      env:
        CI_OP_TOKEN: ${{ inputs.ci-op-token }}
      run: bash scripts/release/setup-release-dependencies.sh
