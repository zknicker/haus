name: Set up Haus release dependencies
description: Install the frozen worktree dependencies with the scoped CI bootstrap identity

inputs:
  ci-op-token:
    description: Existing CI bootstrap identity for licensed dependency setup
    required: true
  install-xcodegen:
    description: Install XcodeGen for the iOS release lane
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.4'
    - name: Set up Node for harness bridges
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Enable the pinned harness package manager
      shell: bash
      run: corepack enable pnpm
    - name: Set up XcodeGen
      if: inputs.install-xcodegen == 'true'
      shell: bash
      env:
        XCODEGEN_VERSION: '2.46.0'
        XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/xcodegen.zip"
        curl -fsSL -o "${archive}" \
          "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
        echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 -c -
        unzip -q "${archive}" -d "${RUNNER_TEMP}"
        echo "${RUNNER_TEMP}/xcodegen/bin" >> "${GITHUB_PATH}"
        "${RUNNER_TEMP}/xcodegen/bin/xcodegen" --version | grep -Fx "Version: ${XCODEGEN_VERSION}"
    - name: Install dependencies with CI bootstrap identity
      shell: bash
      env:
        CI_OP_TOKEN: ${{ inputs.ci-op-token }}
      run: bash scripts/release/setup-release-dependencies.sh
