name: Deploy Release Host

on:
  workflow_dispatch:

concurrency:
  group: deploy-release-host
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy releases.haus.chat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Require the current main revision
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Deploy Worker
        env:
          DEPLOY_AGENT_PRODUCTION_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}
        run: bun run deploy:release-host
      - name: Verify from the consumer
        run: |
          curl --fail --location --show-error --silent --max-time 20 \
            https://releases.haus.chat/computer/latest.json | \
            jq --exit-status '.release.version and .release.sourceRevision' > /dev/null
          curl --fail --location --show-error --silent --max-time 20 \
            https://releases.haus.chat/haus/latest.json | \
            jq --exit-status '.version and .sourceRevision and .components.computer' > /dev/null
