name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      # The licensed @hugeicons-pro scope 401s without its key, so the install
      # itself needs a real credential. It is an @internal schema item, resolved
      # here from the Development vault through the deploy identity. The plugin
      # version is pinned in .env.schema, so this works before node_modules
      # exists. The HeroUI Pro artifact download is deliberately NOT done here:
      # it is a licensed heavyweight download, and the lanes that need it live
      # in `check:heavy`.
      - name: Install dependencies
        timeout-minutes: 5
        env:
          CI_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}
        run: |
          set -euo pipefail
          MERCHBASE_HUGEICONS_LICENSE_KEY="$(
            HAUS_RESOLVE_INSTALL_TOKENS=true \
            bunx varlock@1.16.1 printenv MERCHBASE_HUGEICONS_LICENSE_KEY
          )"
          if [ -z "${MERCHBASE_HUGEICONS_LICENSE_KEY}" ]; then
            echo "MERCHBASE_HUGEICONS_LICENSE_KEY did not resolve; the licensed @hugeicons-pro packages cannot be installed." >&2
            exit 1
          fi
          export MERCHBASE_HUGEICONS_LICENSE_KEY
          bun install --frozen-lockfile

      # `check:fast` pins the schema's `test` lifecycle itself, so every gate
      # here runs fully offline with no 1Password access of its own.
      #
      # Policy, not an oversight: Quality runs the fast lane only. The Haus
      # App typecheck and its unit tests both need the licensed HeroUI Pro dist
      # download; the Server suites each provision a real PostgreSQL cluster;
      # the Computer suites spawn runtimes; the App end-to-end suites drive
      # Playwright; the agent evals call live models. All of that lives in
      # `check:heavy`, which `bun run check` runs on the operator's machine, in
      # cloud agents, and in the release preflight. Keep this job free of
      # licensed downloads, databases, browsers, and builds. The one focused
      # Computer prompt-contract file in `check:fast` is pure and catches prompt
      # budget drift without spawning an execution runtime.
      - name: Run fast quality gates
        run: bun run check:fast
