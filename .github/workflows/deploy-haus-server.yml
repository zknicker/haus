name: Deploy Haus Server

# After the release PR merges, Release calls this workflow automatically through
# the production Environment. Manual dispatch remains available for recovery.
on:
  workflow_call:
    inputs:
      version:
        description: Published Haus version (vX.Y.Z)
        required: true
        type: string
      server_version:
        description: Server artifact version (X.Y.Z)
        required: true
        type: string
      mode:
        description: Production action
        required: true
        type: string
      source_revision:
        description: Expected full release source SHA
        required: true
        type: string
    secrets:
      GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Published Haus version (vX.Y.Z)
        required: true
        type: string
      server_version:
        description: Server artifact version (X.Y.Z)
        required: true
        type: string
      mode:
        description: Production action
        required: true
        type: choice
        options:
          - deploy
          - activate
      source_revision:
        description: Optional expected full release source SHA
        required: false
        type: string

concurrency:
  group: haus-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy published Haus version
    runs-on: [self-hosted, haus]
    environment:
      name: production
      url: https://haus.chat
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      HAUS_DEPLOY_ROOT: /Users/zknicker/srv/haus
      PATH: /opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Resolve published version
        working-directory: /Users/zknicker/srv/haus
        env:
          EXPECTED_SOURCE_REVISION: ${{ inputs.source_revision }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_SERVER_VERSION: ${{ inputs.server_version }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "${REQUESTED_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be an exact vX.Y.Z release tag" >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SERVER_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "server_version must be exact X.Y.Z SemVer" >&2
            exit 1
          fi
          if [[ "${REQUESTED_MODE}" != "deploy" && "${REQUESTED_MODE}" != "activate" ]]; then
            echo "mode must be deploy or activate" >&2
            exit 1
          fi

          release_state="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${REQUESTED_VERSION}" \
              --jq '[.tag_name, .draft, .prerelease, .published_at] | @tsv'
          )"
          IFS=$'\t' read -r published_tag draft prerelease published_at <<<"${release_state}"
          if [[ "${published_tag}" != "${REQUESTED_VERSION}" || "${draft}" != "false" || "${prerelease}" != "false" || -z "${published_at}" || "${published_at}" == "null" ]]; then
            echo "version must name a published, non-prerelease GitHub Release" >&2
            exit 1
          fi

          tag_ref_state="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${REQUESTED_VERSION}" \
              --jq '[.object.type, .object.sha] | @tsv'
          )"
          IFS=$'\t' read -r tag_ref_type tag_object_sha <<<"${tag_ref_state}"
          if [[ "${tag_ref_type}" != "tag" || ! "${tag_object_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release tag must be annotated" >&2
            exit 1
          fi

          tag_state="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
              --jq '[.tag, .object.type, .object.sha] | @tsv'
          )"
          IFS=$'\t' read -r annotated_tag target_type revision <<<"${tag_state}"
          if [[ "${annotated_tag}" != "${REQUESTED_VERSION}" || "${target_type}" != "commit" || ! "${revision}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release tag did not resolve to a full commit" >&2
            exit 1
          fi
          if [[ -n "${EXPECTED_SOURCE_REVISION}" && "${revision}" != "${EXPECTED_SOURCE_REVISION}" ]]; then
            echo "release tag resolved to ${revision}, expected ${EXPECTED_SOURCE_REVISION}" >&2
            exit 1
          fi

          {
            echo "HAUS_RELEASE_MODE=${REQUESTED_MODE}"
            echo "HAUS_RELEASE_VERSION=${REQUESTED_VERSION}"
            echo "HAUS_SERVER_VERSION=${REQUESTED_SERVER_VERSION}"
            echo "HAUS_SOURCE_REVISION=${revision}"
          } >>"${GITHUB_ENV}"

      # The environment contract travels with the repository, not with the
      # artifact. This checks out the workflow's own revision, because the
      # release being deployed may predate the contract entirely — that is
      # exactly the bootstrap case, and it is what makes deploying (or rolling
      # back to) a pre-migration release possible at all. Post-bootstrap the two
      # revisions normally agree, and the render step proves it rather than
      # assuming it. Full history so it can read the released revision's own
      # Server environment module for that comparison.
      #
      # The artifact itself needs no checkout: it is downloaded by tag, verified
      # against its published checksum, and carries its own deploy operation.
      - name: Check out the environment contract
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # The Agent runner image builds from this checkout, so it must be the
          # Server release's own commit.
          ref: ${{ env.HAUS_SOURCE_REVISION }}

      - name: Refuse a stray environment file
        run: |
          set -euo pipefail
          # Varlock loads a checkout .env above .env.schema, and a `$` in any of
          # its values is parsed as an expression — that combination took a
          # sibling service down. Neither the workspace nor the deploy root may
          # hold one.
          for candidate in "${GITHUB_WORKSPACE}/.env" "${HAUS_DEPLOY_ROOT}/.env"; do
            if [[ -e "${candidate}" ]]; then
              echo "${candidate} exists; the schema is the only source of production values." >&2
              exit 1
            fi
          done

      - name: Ensure private PostgreSQL
        run: |
          set -euo pipefail
          docker volume inspect haus_postgres_data >/dev/null
          if [[ "$(docker inspect --format '{{.State.Health.Status}}' haus-postgres 2>/dev/null || true)" == "healthy" ]]; then
            echo "haus-postgres is healthy; leaving the running container untouched."
          else
            # The admin password is interpolated by Compose from the value
            # varlock resolved. No environment file is read or written.
            bunx varlock@1.16.1 run -- \
              docker compose -f apps/server/compose.yml -p haus up -d --wait
          fi
        env:
          VARLOCK_ENV: production
          DEPLOY_AGENT_PRODUCTION_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}

      - name: Deploy downloaded release
        if: env.HAUS_RELEASE_MODE == 'deploy'
        run: |
          set -euo pipefail
          deploy_temp="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/haus-server-deploy.XXXXXX")"
          cleanup() {
            /usr/bin/trash "${deploy_temp}"
          }
          trap 'cleanup' EXIT

          release_id="${HAUS_SERVER_VERSION}+git.${HAUS_SOURCE_REVISION:0:12}"
          archive_name="haus-server-${release_id}-aarch64-apple-darwin.tar.gz"
          archive_asset_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${HAUS_RELEASE_VERSION}" \
              --jq ".assets[] | select(.name == \"${archive_name}\") | .id"
          )"
          checksum_asset_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${HAUS_RELEASE_VERSION}" \
              --jq ".assets[] | select(.name == \"${archive_name}.sha256\") | .id"
          )"
          if [[ ! "${archive_asset_id}" =~ ^[0-9]+$ || ! "${checksum_asset_id}" =~ ^[0-9]+$ ]]; then
            echo "published release must contain the exact Haus Server archive and checksum" >&2
            exit 1
          fi

          archive_path="${deploy_temp}/${archive_name}"
          checksum_path="${archive_path}.sha256"
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${archive_asset_id}" \
            --header "Accept: application/octet-stream" >"${archive_path}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${checksum_asset_id}" \
            --header "Accept: application/octet-stream" >"${checksum_path}"
          (
            cd "${deploy_temp}"
            /usr/bin/shasum -a 256 -c "${archive_name}.sha256"
          )

          /bin/mkdir "${deploy_temp}/operation"
          /usr/bin/tar -xzf "${archive_path}" \
            -C "${deploy_temp}/operation" \
            ./bin/haus-server-deploy
          test -f "${deploy_temp}/operation/bin/haus-server-deploy"
          test ! -L "${deploy_temp}/operation/bin/haus-server-deploy"
          test -x "${deploy_temp}/operation/bin/haus-server-deploy"
          "${deploy_temp}/operation/bin/haus-server-deploy" \
            install \
            "${archive_path}" \
            "${HAUS_RELEASE_VERSION}" \
            "${HAUS_SOURCE_REVISION}"

      - name: Verify installed release
        run: |
          bun scripts/verify-haus-server-release.ts \
            "${HAUS_DEPLOY_ROOT}/releases/${HAUS_SOURCE_REVISION}" \
            "${HAUS_RELEASE_VERSION}" \
            "${HAUS_SOURCE_REVISION}"

      # The delivered runtime copy. Rendered from .env.schema every deploy, so
      # a renamed or removed value can never survive in production, and mode
      # 0600 plus one ACL entry gives _haus_server exactly the read it needs
      # without any privileged helper.
      - name: Render the Server environment
        env:
          VARLOCK_ENV: production
          DEPLOY_AGENT_PRODUCTION_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}
        run: |
          set -euo pipefail
          # Resolution is the one place this deploy leaves the machine: varlock
          # reads every production value from 1Password, and a 502 there has
          # already failed an otherwise healthy deploy. Rendering is idempotent
          # — resolve, write one file — so a bounded retry is safe. The
          # migration step deliberately gets none: it mutates the database.
          attempt=1
          until bunx varlock@1.16.1 run -- bun scripts/render-server-env.ts \
            --source-revision "${HAUS_SOURCE_REVISION}"; do
            if [ "${attempt}" -ge 3 ]; then
              echo "Rendering the Server environment failed ${attempt} times; giving up." >&2
              exit 1
            fi
            echo "Render attempt ${attempt} failed; retrying in $((attempt * 5))s." >&2
            /bin/sleep "$((attempt * 5))"
            attempt=$((attempt + 1))
          done

      - name: Apply database migrations
        env:
          VARLOCK_ENV: production
          DEPLOY_AGENT_PRODUCTION_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}
        run: |
          set -euo pipefail
          migration_binary="${HAUS_DEPLOY_ROOT}/releases/${HAUS_SOURCE_REVISION}/bin/haus-server-migrate"
          migration_result=""
          if migration_result="$(bunx varlock@1.16.1 run -- "${migration_binary}")"; then
            echo "Database: ✅ ${migration_result}"
            {
              echo "### Database"
              echo
              echo "- ✅ ${migration_result}"
            } >>"${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "### Database"
              echo
              echo "- ❌ Migration failed; release was not activated."
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

      - name: Activate migrated release
        run: |
          /usr/bin/sudo -n /usr/local/libexec/haus/activate-haus-server \
            "${HAUS_SOURCE_REVISION}"

      - name: Prove local Server health
        run: |
          set -euo pipefail
          response="$(
            /usr/bin/curl --fail --silent --show-error --max-time 8 \
              http://127.0.0.1:18791/healthz
          )"
          health_status="$(
            /usr/bin/python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])' \
              <<<"${response}"
          )"
          test "${health_status}" = "ok"

      # Names only: a delivered name the schema no longer declares is stale, and
      # a production-required secret missing from delivery is a failure.
      - name: Verify the delivered environment
        run: bun scripts/verify-deployed-secrets.ts

      - name: Prove public Server and hosted Haus App
        run: bun scripts/release/verify-hosted-haus.mjs "${HAUS_RELEASE_VERSION#v}"

      - name: Start the Agent runner
        run: |
          set -euo pipefail
          bunx varlock@1.16.1 run -- \
            docker compose -f apps/server/compose.yml -p haus --profile runner \
              up -d --build --force-recreate --wait haus-runner
        env:
          VARLOCK_ENV: production
          DEPLOY_AGENT_PRODUCTION_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}

      - name: Prove the runner reaches only the Server
        run: |
          set -euo pipefail
          docker exec -u haus-runner haus-runner \
            /app/apps/runner/container/prove-network-deny.sh
